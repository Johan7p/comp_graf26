<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="600" height="120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6DE8D"/>
      <stop offset="0.5" stop-color="#CBA34A"/>
      <stop offset="1" stop-color="#8F6B1E"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8F6B1E"/>
      <stop offset="0.5" stop-color="#F6DE8D"/>
      <stop offset="1" stop-color="#8F6B1E"/>
    </linearGradient>
    <pattern id="stripes" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect x="0" y="0" width="10" height="40" fill="#0B0B0B"/>
      <rect x="10" y="0" width="10" height="40" fill="#F5F3EE"/>
      <rect x="20" y="0" width="10" height="40" fill="#8E1B2D"/>
      <rect x="30" y="0" width="10" height="40" fill="#F5F3EE"/>
    </pattern>
  </defs>

  <g font-family="'Playfair Display','Didot','Bodoni MT',Georgia,serif" text-anchor="middle">
    <text x="300" y="20" font-size="13" letter-spacing="9" fill="#F5F3EE">BARBER SHOP</text>
    <text x="300" y="76" font-size="56" font-weight="700" letter-spacing="4"><tspan fill="url(#gold)">PREMIUM</tspan><tspan fill="#F5F3EE" dx="18">CUTS</tspan></text>
  </g>

  <!-- Listón de barbero -->
  <rect x="6" y="88" width="588" height="24" rx="12" fill="url(#stripes)"/>
  <rect x="6" y="88" width="588" height="24" rx="12" fill="none" stroke="url(#goldH)" stroke-width="3"/>
</svg>
