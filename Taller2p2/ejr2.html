<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width" , initial-scale="1.0">
    <title>Formulario de Reserva</title>
    <link rel="stylesheet" href="./css/styles2.css">
</head>

<body>
    <form action="#" method="POST">
        <h1>Formulario de Reserva</h1>
        <div class="form-field">
            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha" name="fecha">
            <br>

            <label for="hora">Hora:</label>
            <input type="time" id="hora" name="hora">
            <br>

            <label for="personas">Número de personas:</label>
            <input type="number" id="personas" name="personas" min="1" max="20">
            <br>

            <label for="comentarios">Comentarios:</label>
            <textarea id="comentarios" name="comentarios" rows="4" cols="30" placeholder="Algo mas por agregar..."></textarea>
            <br>
        </div>
        <div class="form-actions">
            <button type="submit" class="button-reserve">Reservar</button>
            <button type="reset" class="button-clean"> Limpiar</button>
        </div>
    </form>
</body>

</html>
