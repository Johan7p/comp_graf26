<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width" , initial-scale="1.0">
    <title>Formulario de Soporte</title>
    <link rel="stylesheet" href="./css/styles5.css">
</head>
<body>

    <form action="#" method="POST">
        <h1>Formulario de Soporte Técnico</h1>
        <p class="desc">Rellene los campos especificando su problema.</p>
        <div class="form-field">
            <label for="asunto">Asunto<span class="req">*</span></label>
            <input type="text" id="asunto" name="asunto" placeholder="Ej: La pantalla no enciende" required>
            <p></p>
            <label for="prioridad">Prioridad<span class="req">*</span></label>
                <select id="prioridad" name="prioridad" required>
                    <option value="baja">Baja</option>
                    <option value="media">Media</option>
                    <option value="alta">Alta</option>
                    <option value="urgente">Urgente</option>
                </select>
            <p></p>

            <label for="descripcion">Descripción del problema</label>
            <br>
            <textarea id="descripcion" name="descripcion" rows="5" cols="30" placeholder="Describa su problema..."></textarea>
            <p></p>

            <label for="archivo">Adjuntar archivo</label>
            <input type="file" id="archivo" name="archivo" accept=".pdf, .doc, .docx">
            <p>Formato sugerido: PDF, .doc</p>
            <p></p>
        </div>
        <div class="form-actions">
            <button type="submit" class="button-send">Enviar Ticket</button>
            <button type="reset" class="button-clean"> Limpiar</button>
        </div>

    </form>
</body>
</html>
