<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width" , initial-scale="1.0">
    <title>Encuesta</title>
    <link rel="stylesheet" href="./css/styles3.css">
</head>

<body>
    <form action="#" method="POST">
        <h1>Encuesta de Satisfacción</h1>
        <div class="form-field">
            <h5>¿Cuál es tu género?</h5>
            <label>
            <input type="radio" name="genero" value="masculino">
            Masculino</label>

            <label>
            <input type="radio" name="genero" value="femenino">
            Femenino</label>

            <label>
            <input type="radio" name="genero" value="otro">
            Otro</label>
            <hr>
            <h5>¿Qué servicios usaste?</h5>
            <label>
            <input type="checkbox" name="servicios" value="soporte">
            Soporte</label>

            <label>
            <input type="checkbox" name="servicios" value="ventas">
            Ventas</label>

            <label>
            <input type="checkbox" name="servicios" value="entrega">
            Entrega</label>
            <hr>
            <h5>Califica tu experiencia (1 a 10):</h5>
            <input type="range" id="calificacion" name="calificacion" min="1" max="10">
        </div>
        <br><br>
        <div class="form-actions">
            <button type="submit" class="button-send">Enviar</button>
        </div>
    </form>
</body>
</html>
