<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width" , initial-scale="1.0">
    <title> Formulario</title>
    <link rel="stylesheet" href="./css/styles1.css">
</head>

<body>
    <form action="#" method="POST">
        <h1>Formulario de registro</h1>
        <h4 class="tit3"> Complete los campos.</h4>
        <fieldset>
        <div class="Datos">
            <div class="form-field">
                <label for="nombre">Nombre <span class="req">*</span></label>
                <input type="text" 
                id="nombre"
                name="nombre"
                placeholder="Johan"
                required
                autocomplete="name">
            </div>
            <div class="form-field">
                <label for="apellido">Apellido <span class="req">*</span></label>
                <input type="text" 
                id="apellido"
                name="apellido"
                placeholder="Perez"
                required
                autocomplete="last-name">
            </div>
        </div>
        <div class="corr">
            <div class="form-field">
                <label for="correo">Correo <span class="req">*</span></label>
                <input type="text" 
                id="correo"
                name="correo"
                placeholder="example@dom.co"
                required
                autocomplete="correo1@dominio.com">
            </div>
        </div>
        <div class="pass">    
            <div class="form-field">
                <label for="pass">Contraseña <span class="req">*</span></label>
                <input type="password" 
                id="pass"
                name="pass"
                required>
            </div>
        </div>
        <p></p>
        <div class="term">
            <label>
                <input type="checkbox"
                name="termi"
                value="termi"
                >Acepto los terminos y condiciones
            </label>
        </div>
        </fieldset>
        <div class="form-actions">
            <button type="submit" class="button-send"> Resgistrar</button>
            <button type="reset" class="button-clean"> Limpiar</button>
        </div>
</body>
</html>
