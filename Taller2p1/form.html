<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width" , initial-scale="1.0">
    <title> Formulario</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <form action="#" method="POST">
        <h6 class="tit"> Contacto</h6>
        <h1>Cuéntenos sobre su necesidad</h1>
        <h6 class="tit3"> Complete el formulario. Los campos con * son obligatorios</h6>
        <h5> Datos Personales</h5>
        <div class="Datos-P">
            <div class="form-field">
                <label for="nombre">Nombre <span class="req">*</span></label>
                <input type="text" 
                id="nombre"
                name="nombre"
                placeholder="Johan"
                required
                autocomplete="name">

                <label for="correo">Correo <span class="req">*</span></label>
                <input type="text" 
                id="correo"
                name="correo"
                placeholder="example@dom.co"
                required
                autocomplete="correo1@dominio.com">
            </div>
            <div class="form-field">
                <label for="apellido">Apellido <span class="req">*</span></label>
                <input type="text" 
                id="apellido"
                name="apellido"
                placeholder="Perez"
                required
                autocomplete="last-name">

                <label for="telefono">Telefono</label>
                <input type="tel" 
                id="tel"
                name="tel"
                placeholder="+57 300 000 0000"
                required>
            </div>
        </div>
        <h5> Organización</h5>
        <div class="Org">
            <div class="form-field">
                <label for="empresa">Empresa</label>
                <input type="text" 
                id="emp"
                name="emp"
                required>
            </div>
            <div class="form-field">
                <label for="empleados">No. de Empleados</label>
                <input type="number" 
                id="empl"
                name="empl"
                required>
            </div>
        </div>
        <div class="Org2">
            <label for="servicio"> Servicio de interés <span class="req">*</span></label>
            <select id="servicio" name="servicio" required>

            <option value="" disabled selected hidden>Seleccione un servicio</option>

                <optgroup label="Servicios 1">

                    <option value="pentesting"> Op1</option>
                    <option value="devsecops"> Op2</option>
                    <option value="ai-security"> Op3</option>

                </optgroup>

                <optgroup label="Servicios 2">

                    <option value="dev1"> Opc1</option>
                    <option value="dev2"> Opc2</option>
                    <option value="dev3"> Opc3</option>

                </optgroup>
            </select>
        </div>
        <h5> Disponibilidad</h5>
        <div class="Disp">
            <div class="form-field">
                <label for="fecha"> Fecha de preferencia</label>
                    <input type="date"
                    id="fecha"
                    name="fecha">
            </div>
            <div class="form-field">
                <label for="fecha"> Hora de preferencia</label>
                    <input type="time" id="hora" name="hora">
            </div>
        </div>
        <div class="cont">
            <div class="form-field">
                <fieldset>
                    <legend> Modalidad de contacto</legend>
                    <label>
                        <input type="radio"
                        name="tipo-contacto"
                        value="correo"
                        checked>
                        Correo Electronico
                    </label>
                    <label>
                        <input type="radio"
                        name="tipo-contacto"
                        value="telefono">
                        Telefono
                    </label>
                    <label>
                        <input type="radio"
                        name="tipo-contacto"
                        value="videollamada">
                        Videollamada
                        <!-- name debe tener el mismo nombre para seleccionar una opcion -->
                    </label>
                </fieldset>
            </div>
        </div>
        <div class="tem">
            <div class="form-field">
                <fieldset>
                    <legend>Temas adicionales de interes</legend>
                    <label>
                        <input type="checkbox"
                        name="intereses"
                        value="seguridad de aplicaciones">
                        Seguridad de Aplicaciones
                    </label>
                    <label>
                        <input type="checkbox"
                        name="intereses"
                        value="cloud security">
                        Cloud Security
                    </label>
                    <label>
                        <input type="checkbox"
                        name="intereses"
                        value="ai security">
                        AI Security
                    </label>
                </fieldset>
            </div>
        </div>
        <p></p>
        <div class="nec">
            <div class="form-field">
                <label for="mensaje">Describa su Necesidad <span class="req">*</span></label>
                <textarea id="mensaje"
                name="mensaje"
                rows="6"
                maxlength="1200"
                placeholder="Cuentenos brevemente que necesita..."></textarea>
            </div>
            <h6> Minimo 1200 caracteres</h6>
        </div>
        <p></p>
        <div class="doc">
            <div class="form-field">
                <label> Documento de soporte</label>
                <fieldset>
                    <input type="file"
                    id="archivo"
                    name="archivo"
                    accept=".pdf,.doc,.docx,.xls,.xlsx">
                </fieldset>
            </div>
            <h6> Formatos sugeridos: PDF, Word o Excel.</h6>
        </div>
        <p></p>
        <div class="term">
            <label>
                <input type="checkbox"
                name="termi"
                value="termi"
                >Acepto el tratamiento de la informacion suministrada
            </label>
        </div>
        <p></p>
        <div class="form-actions">
            <button type="submit" class="button-send"> Enviar Solicitud</button>
            <button type="reset" class="button-clean"> Limpiar</button>
        </div>
    </form>
</body>
</html>
